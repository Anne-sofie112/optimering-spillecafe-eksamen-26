<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spilcafeén</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <main class="location-page">
      <img
        src="img/logo-250.webp"
        alt="Spilcaféen"
        class="location-page__logo"
        width="250"
        height="189"
      />
      <h1 class="location-page__title">Hvilken café?</h1>
      <p class="location-page__subtitle">
        Vælg din café for at se, hvilke spil de har.
      </p>

      <nav class="location-list" aria-label="Vælg café">
        <a
          href="sites/spilgalleri.html?location=Vestergade"
          class="location-choice"
        >
          <img
            class="location-choice__image location-choice__image--vestergade"
            src="img/cafevestergade.webp"
            alt="Spilcaféen på Vestergade"
          />
          <div class="location-choice__content">
            <span class="location-choice__name">Vestergade</span>
            <span class="location-choice__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          href="sites/spilgalleri.html?location=Fredensgade"
          class="location-choice"
        >
          <img
            class="location-choice__image location-choice__image--fredensgade"
            src="img/cafefredensgade.webp"
            alt="Spilcaféen på Fredensgade"
            loading="lazy"
          />
          <div class="location-choice__content">
            <span class="location-choice__name">Fredensgade</span>
            <span class="location-choice__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          href="sites/spilgalleri.html?location=Aalborg"
          class="location-choice"
        >
          <img
            class="location-choice__image location-choice__image--aalborg"
            src="img/cafeaalborg.webp"
            alt="Spilcaféen i Aalborg"
            loading="lazy"
          />
          <div class="location-choice__content">
            <span class="location-choice__name">Aalborg</span>
            <span class="location-choice__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          href="sites/spilgalleri.html?location=Kolding"
          class="location-choice"
        >
          <img
            class="location-choice__image location-choice__image--kolding"
            src="img/cafekolding.webp"
            alt="Spilcaféen i Kolding"
            loading="lazy"
          />
          <div class="location-choice__content">
            <span class="location-choice__name">Kolding</span>
            <span class="location-choice__arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </nav>
    </main>

    <footer>
      <p>© Spilcaféen</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
