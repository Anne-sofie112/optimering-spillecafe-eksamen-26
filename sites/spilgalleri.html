<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/app.css" />
    <title>Spilgalleri</title>
  </head>

  <body class="page-gallery">
    <div class="gallery-topbar">
      <header class="navbar">
        <img src="../img/logo-250.webp" alt="Spilcaféen" class="gallery-logo" />
        <a
          class="back-btn"
          href="../index.html"
          aria-label="Tilbage til valg af café"
        >
          ←
        </a>
        <h1 class="spilgalleri-titel">Spilgalleri</h1>
        <div class="filter-group search-group">
          <label for="search-input"
            ><svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m21 21-4.34-4.34" />
              <circle cx="11" cy="11" r="8" /></svg
            >Søg efter spil</label
          >
          <input
            type="search"
            id="search-input"
            name="search"
            placeholder="Find et spil..."
          />
        </div>
      </header>

      <section class="filter-bar">
        <div class="filter-group">
          <label for="difficulty-select"
            ><svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m12 14 4-4" />
              <path d="M3.34 19a10 10 0 1 1 17.32 0" /></svg
            >Sværhedsgrad</label
          >
          <select id="difficulty-select">
            <option value="all">Alle</option>
            <option value="Let">Let</option>
            <option value="Mellem">Mellem</option>
            <option value="Svær">Svær</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="age-select"
            ><svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8" />
              <path d="M4 16s.5-2 4-2 4 2 4 2 1-2 4-2 4 2 4 2" />
              <path d="M2 21h20" />
              <path d="M7 8v2" />
              <path d="M12 8v2" />
              <path d="M17 8v2" />
              <path d="M7 4h.01" />
              <path d="M12 4h.01" />
              <path d="M17 4h.01" /></svg
            >Alder</label
          >
          <select id="age-select">
            <option value="all">Alle</option>
            <option value="6">6+</option>
            <option value="7">7+</option>
            <option value="8">8+</option>
            <option value="10">10+</option>
            <option value="18">18+</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="genre-select"
            ><svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="8" height="8" rx="1" />
              <circle cx="17" cy="7" r="4" />
              <path d="m13 21 4-7 4 7z" /></svg
            >Genrer</label
          >
          <select id="genre-select">
            <option value="all">Alle</option>
            <option value="Party">Party</option>
            <option value="Mysterie">Mysterie</option>
            <option value="Familie">Børne-/Familie</option>
            <option value="Deck-builder">Deck-builder</option>
            <option value="Quiz">Quiz</option>
            <option value="Terning">Terning</option>
            <option value="Kooperativt">Kooperativt</option>
            <option value="Abstract">Abstract</option>
            <option value="Ordspil">Ordspil</option>
            <option value="Kortspil">Kortspil</option>
            <option value="Strategi">Strategi</option>
            <option value="Fliselægning">Fliselægning</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="players-select"
            ><svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="10" cy="7" r="4" />
              <path d="M20 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg
            >Antal spillere</label
          >

          <select id="players-select" name="players">
            <option value="all">Alle</option>
            <option value="2">2 spillere</option>
            <option value="3">3 spillere</option>
            <option value="4">4 spillere</option>
            <option value="5">5 spillere</option>
            <option value="6">6 spillere</option>
            <option value="7">7 spillere</option>
            <option value="8">8 spillere</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="playtime-select"
            ><svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6h4" /></svg
            >Spilletid</label
          >
          <select id="playtime-select">
            <option value="all">Alle</option>
            <option value="15">15+ min</option>
            <option value="20">20+ min</option>
            <option value="30">30+ min</option>
            <option value="35">35+ min</option>
            <option value="40">40+ min</option>
            <option value="45">45+ min</option>
            <option value="60">60+ min</option>
            <option value="75">75+ min</option>
            <option value="120">120+ min</option>
          </select>
        </div>

        <button
          type="button"
          id="reset-filters"
          aria-label="Nulstil alle filtre"
        >
          Nulstil filtre
        </button>
      </section>
    </div>

    <main class="main-content">
      <p id="results-count" class="results-count" aria-live="polite"></p>
      <section class="game-list-all"></section>
    </main>

    <!-- Footer -->
    <footer>
      <p>© Spilcaféen</p>
    </footer>

    <!-- Game Detail Modal -->
    <dialog id="game-dialog" aria-label="Spilinformation" aria-modal="true">
      <form method="dialog">
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <script src="../js/app.js"></script>
  </body>
</html>
